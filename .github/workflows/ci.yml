name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, with longer fuzzing (see the Fuzz step).
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

# A new push to a pull request cancels the run for its old commit. Other runs get a group of their own, so a run on
# main is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tools/pack.ps1 numbers the packages by the commit count

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet build Folio.slnx -c Release

      # The host packages build.
      - run: pwsh -File tools/pack.ps1

      # Unicode conformance test files for the pinned version, cached per version and checksum file. Each file is
      # checked against tools/Folio.Gen/unicode-<version>.sha256 whether it came from the cache or the download.
      - name: Cache Unicode test files
        uses: actions/cache@v4
        with:
          path: .cache/unicode
          key: unicode-18.0.0-${{ hashFiles('tools/Folio.Gen/unicode-18.0.0.sha256') }}

      - name: Fetch Unicode test files
        shell: bash
        run: |
          set -euo pipefail
          version=18.0.0
          dir=".cache/unicode/$version"
          files="auxiliary/LineBreakTest.txt auxiliary/WordBreakTest.txt BidiTest.txt BidiCharacterTest.txt"
          for f in $files; do
            if [ ! -f "$dir/$f" ]; then
              mkdir -p "$(dirname "$dir/$f")"
              curl -fsSL --retry 3 -o "$dir/$f" "https://www.unicode.org/Public/$version/ucd/$f"
            fi
          done
          sums="$(tr -d '\r' < "tools/Folio.Gen/unicode-$version.sha256")"
          cd "$dir"
          for f in $files; do
            grep "  $f\$" <<< "$sums"
          done | sha256sum -c -

      # URL parser and setter test data from web-platform-tests at a pinned revision, cached per revision and checksum
      # file. Each file is checked against tools/Folio.Gen/wpt-url.sha256 whether it came from the cache or the download.
      - name: Cache URL test files
        uses: actions/cache@v4
        with:
          path: .cache/wpt-url
          key: wpt-url-514913ff14fde47147cc4fa84444d86dc8bc3112-${{ hashFiles('tools/Folio.Gen/wpt-url.sha256') }}

      - name: Fetch URL test files
        shell: bash
        run: |
          set -euo pipefail
          revision=514913ff14fde47147cc4fa84444d86dc8bc3112
          dir=".cache/wpt-url/$revision"
          files="urltestdata.json urltestdata-javascript-only.json setters_tests.json toascii.json"
          for f in $files; do
            if [ ! -f "$dir/$f" ]; then
              mkdir -p "$dir"
              curl -fsSL --retry 3 -o "$dir/$f" "https://raw.githubusercontent.com/web-platform-tests/wpt/$revision/url/resources/$f"
            fi
          done
          sums="$(tr -d '\r' < tools/Folio.Gen/wpt-url.sha256)"
          cd "$dir"
          for f in $files; do
            grep "  $f\$" <<< "$sums"
          done | sha256sum -c -

      # Keep unrelated test executables from starving a real content process's
      # watchdog during cold startup on a small runner.
      - run: dotnet test --solution Folio.slnx -c Release --no-build --max-parallel-test-modules 1

      # Pass rates per conformance category, also on the run's summary page. Runtime/interaction failures and stale
      # expected-failure marks fail both the tests and report command; ordinary image mismatches remain report-only.
      - name: Conformance report
        if: always()
        run: dotnet tests/Folio.RenderTests/bin/Release/net10.0/Folio.RenderTests.dll conformance

      # Time and memory per benchmark document, also on the run's summary page. Documents over a target only warn.
      - name: Benchmarks
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tests/Folio.Benchmarks/bin/Release/net10.0/Folio.Benchmarks.dll bench

      - name: Sandboxed GPU memory
        if: matrix.os == 'windows-latest'
        run: dotnet tests/Folio.Benchmarks/bin/Release/net10.0/Folio.Benchmarks.dll gpu

      # Actual, expected and diff images of every failing or changed image test.
      - name: Upload image test output
        id: render-output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-output-${{ matrix.os }}
          path: tests/render-output/
          if-no-files-found: ignore

      # Lists those tests on the run's summary page, with a link to the images.
      - name: List image test output
        if: always() && steps.render-output.outputs.artifact-url != ''
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.render-output.outputs.artifact-url }}
        run: |
          {
            echo "### Image tests that failed or changed (${{ matrix.os }})"
            echo "Actual, expected and diff images: [render-output-${{ matrix.os }}]($ARTIFACT_URL)"
            echo
            find tests/render-output -name '*.actual.png' | sed 's|^tests/render-output/||; s|\.actual\.png$||' | sort | sed 's|^|- |'
          } >> "$GITHUB_STEP_SUMMARY"

      # Mutation fuzzing of the parsers and decoders, per target: 10 seconds on pull requests and main, 120 in the
      # nightly run. The aggregate nightly suite takes over 20 minutes, so leave room for all targets to finish.
      - name: Fuzz
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: ${{ github.event_name == 'schedule' && 30 || 10 }}
        run: dotnet tests/Folio.Fuzz/bin/Release/net10.0/Folio.Fuzz.dll fuzz ${{ github.event_name == 'schedule' && 120 || 10 }}

      # Inputs the fuzzer failed on; add them to tests/Folio.Fuzz/Regressions/<target>/ with the fix.
      - name: Upload fuzz failures
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-output
          path: tests/fuzz-output/
          if-no-files-found: ignore

  capability-matrix:
    name: capability matrix (${{ matrix.capability }})
    strategy:
      fail-fast: false
      matrix:
        capability: [none, webgl, media, sound, camera, microphone, workers, webassembly, iframes, webrtc, service-workers, all]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Folio.slnx -c Release
      - name: Run sandbox and limits suite (${{ matrix.capability }})
        env:
          FOLIO_CAPABILITY_MATRIX: ${{ matrix.capability }}
        run: dotnet tests/Folio.Scripting.Tests/bin/Release/net10.0/Folio.Scripting.Tests.dll -class '*CapabilityMatrixTests' -class '*WindowsSandboxTests'
      - name: Verify frame retention, stopped notice and view lifecycle (${{ matrix.capability }})
        env:
          FOLIO_CAPABILITY_MATRIX: ${{ matrix.capability }}
        run: dotnet tests/Folio.WinForms.Tests/bin/Release/net10.0-windows/Folio.WinForms.Tests.dll
