name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, with longer fuzzing (see the Fuzz step).
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

# A new push to a pull request cancels the run for its old commit. Other runs get a group of their own, so a run on
# main is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tools/pack.ps1 numbers the packages by the commit count

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet build Folio.slnx -c Release

      # The dependency-first path is allowed during development, but the Folio-owned replacement track is a hard
      # completion gate. Keep the roadmap from regressing to the old optional-track wording.
      - name: Enforce Folio-owned replacement gate
        shell: pwsh
        run: |
          $files = @('README.md', 'docs/roadmap.md', 'docs/dependencies.md', 'docs/replacement-gate.md')
          $matches = Select-String -Path $files -Pattern '## Optional track|replacements?[^\r\n]*(optional|never blocks)' -AllMatches
          if ($matches) {
            $matches | ForEach-Object { Write-Host $_.ToString() }
            throw 'The Folio-owned replacement track must remain mandatory and non-waivable.'
          }

      # The host packages build.
      - run: pwsh -File tools/pack.ps1

      # Unicode conformance test files for the pinned version, cached per version and checksum file. Each file is
      # checked against tools/Folio.Gen/unicode-<version>.sha256 whether it came from the cache or the download.
      - name: Cache Unicode test files
        uses: actions/cache@v4
        with:
          path: .cache/unicode
          key: unicode-18.0.0-${{ hashFiles('tools/Folio.Gen/unicode-18.0.0.sha256') }}

      - name: Fetch Unicode test files
        shell: bash
        run: |
          set -euo pipefail
          version=18.0.0
          dir=".cache/unicode/$version"
          files="auxiliary/LineBreakTest.txt auxiliary/WordBreakTest.txt BidiTest.txt BidiCharacterTest.txt"
          for f in $files; do
            if [ ! -f "$dir/$f" ]; then
              mkdir -p "$(dirname "$dir/$f")"
              curl -fsSL --retry 3 -o "$dir/$f" "https://www.unicode.org/Public/$version/ucd/$f"
            fi
          done
          sums="$(tr -d '\r' < "tools/Folio.Gen/unicode-$version.sha256")"
          cd "$dir"
          for f in $files; do
            grep "  $f\$" <<< "$sums"
          done | sha256sum -c -

      # Keep unrelated test executables from starving a real content process's
      # watchdog during cold startup on a small runner.
      - run: dotnet test --solution Folio.slnx -c Release --no-build --max-parallel-test-modules 1

      # Pass rates per conformance category, also on the run's summary page. Runtime/interaction failures and stale
      # expected-failure marks fail both the tests and report command; ordinary image mismatches remain report-only.
      - name: Conformance report
        if: always()
        run: dotnet tests/Folio.RenderTests/bin/Release/net10.0/Folio.RenderTests.dll conformance

      # Keep the mandatory Folio-owned replacement path on the complete
      # conformance corpus, not only the focused WebGL category.
      - name: Native conformance report
        if: always() && matrix.os == 'windows-latest'
        env:
          FOLIO_CONFORMANCE_ENGINE: native
        run: dotnet tests/Folio.RenderTests/bin/Release/net10.0/Folio.RenderTests.dll conformance

      # D8 is Folio's native WebGL acceptance category; the compatibility engine intentionally routes it away.
      - name: Native WebGL conformance
        if: always() && matrix.os == 'windows-latest'
        env:
          FOLIO_CONFORMANCE_ENGINE: native
        run: dotnet tests/Folio.RenderTests/bin/Release/net10.0/Folio.RenderTests.dll conformance D8

      # The Folio-owned engine must keep the canvas animation budget; the command
      # exits non-zero when any D5/D7 artifact exceeds the 16.7 ms p95 target.
      - name: Native canvas frame budget
        if: always() && matrix.os == 'windows-latest'
        env:
          FOLIO_CONFORMANCE_ENGINE: native
        run: dotnet tests/Folio.RenderTests/bin/Release/net10.0/Folio.RenderTests.dll canvas-frames 30

      # Time and memory per benchmark document, also on the run's summary page. Documents over a target only warn.
      - name: Benchmarks
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tests/Folio.Benchmarks/bin/Release/net10.0/Folio.Benchmarks.dll bench

      # M4 scripted startup, first-paint and content-process working-set evidence.
      # The command reports target misses as warnings while #677 is open; keeping it
      # in the Windows matrix prevents the recovery gate from becoming stale.
      # ReadyToRun apphosts currently fail-fast inside the AppContainer on the
      # Windows runner (0xC0000602), before the protocol can emit a frame. The
      # framework-dependent published apphost is the same shipped layout and
      # remains runnable under the sandbox, so benchmark that artifact instead.
      - name: Publish content host for scripted benchmarks
        if: matrix.os == 'windows-latest'
        # This runtime-specific publish needs its own assets file entry. The
        # solution restore above is framework-only, so --no-restore produces
        # NETSDK1047 before the benchmark can run.
        run: dotnet publish tools/Folio.ContentHost/Folio.ContentHost.csproj -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=false -o tools/Folio.ContentHost/bin/Release/net10.0/win-x64/publish
      - name: Scripted process benchmarks
        if: matrix.os == 'windows-latest'
        env:
          FOLIO_CONTENT_HOST: ${{ github.workspace }}\tools\Folio.ContentHost\bin\Release\net10.0\win-x64\publish\Folio.ContentHost.exe
        run: dotnet tests/Folio.Benchmarks/bin/Release/net10.0/Folio.Benchmarks.dll scripted

      - name: Sandboxed GPU memory
        if: matrix.os == 'windows-latest'
        run: dotnet tests/Folio.Benchmarks/bin/Release/net10.0/Folio.Benchmarks.dll gpu

      - name: Native WebGL shader fuzzing
        if: matrix.os == 'windows-latest'
        timeout-minutes: 5
        run: dotnet tests/Folio.Fuzz/bin/Release/net10.0/Folio.Fuzz.dll fuzz ${{ github.event_name == 'schedule' && 120 || 10 }} webgl-shader

      # Actual, expected and diff images of every failing or changed image test.
      - name: Upload image test output
        id: render-output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-output-${{ matrix.os }}
          path: tests/render-output/
          if-no-files-found: ignore

      # Lists those tests on the run's summary page, with a link to the images.
      - name: List image test output
        if: always() && steps.render-output.outputs.artifact-url != ''
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.render-output.outputs.artifact-url }}
        run: |
          {
            echo "### Image tests that failed or changed (${{ matrix.os }})"
            echo "Actual, expected and diff images: [render-output-${{ matrix.os }}]($ARTIFACT_URL)"
            echo
            find tests/render-output -name '*.actual.png' | sed 's|^tests/render-output/||; s|\.actual\.png$||' | sort | sed 's|^|- |'
          } >> "$GITHUB_STEP_SUMMARY"

      # Mutation fuzzing of the parsers and decoders, per target: 10 seconds on pull requests and main, 120 in the
      # nightly run. The aggregate nightly suite has sixteen targets and needs more than the old 30-minute step cap;
      # keep it below the 60-minute job cap while leaving room for setup and result upload.
      - name: Fuzz
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: ${{ github.event_name == 'schedule' && 55 || 10 }}
        run: dotnet tests/Folio.Fuzz/bin/Release/net10.0/Folio.Fuzz.dll fuzz ${{ github.event_name == 'schedule' && 120 || 10 }}

      # Inputs the fuzzer failed on; add them to tests/Folio.Fuzz/Regressions/<target>/ with the fix.
      - name: Upload fuzz failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-output-${{ matrix.os }}
          path: tests/fuzz-output/
          if-no-files-found: ignore

  capability-matrix:
    name: capability matrix (${{ matrix.capability }}, ${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        capability: [none, webgl, media, sound, camera, microphone, workers, webassembly, iframes, webrtc, service-workers, all]
        engine: [jint, native]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Folio.slnx -c Release
      - name: Run sandbox and limits suite (${{ matrix.capability }})
        env:
          FOLIO_CAPABILITY_MATRIX: ${{ matrix.capability }}
          FOLIO_SCRIPT_ENGINE: ${{ matrix.engine }}
        run: dotnet tests/Folio.Scripting.Tests/bin/Release/net10.0/Folio.Scripting.Tests.dll -class '*CapabilityMatrixTests' -class '*WindowsSandboxTests'
      - name: Verify frame retention, stopped notice and view lifecycle (${{ matrix.capability }})
        env:
          FOLIO_CAPABILITY_MATRIX: ${{ matrix.capability }}
          FOLIO_SCRIPT_ENGINE: ${{ matrix.engine }}
        run: dotnet tests/Folio.WinForms.Tests/bin/Release/net10.0-windows/Folio.WinForms.Tests.dll
