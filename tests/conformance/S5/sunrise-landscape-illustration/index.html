<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Hike — Illustrated Postcard</title>
<style>
  body { margin: 0; background: #1b1033; font-family: "Palatino Linotype", Palatino, serif; color: #f6efe4; }
  .postcard { max-width: 820px; margin: 30px auto; background: #fff8ee; color: #3d2c1e; border-radius: 10px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.45); }
  svg { display: block; width: 100%; height: auto; }
  .note { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; padding: 20px 26px 26px; }
  .note h1 { font-size: 26px; margin: 0 0 8px; font-style: italic; }
  .note p { margin: 0; line-height: 1.55; }
  .stamp { border: 2px dashed #c28b5a; border-radius: 6px; text-align: center; padding: 10px; font-size: 13px; color: #9a6b44; }
  .stamp b { display: block; font-size: 28px; color: #c2410c; }
</style>
</head>
<body>
<div class="postcard">
  <svg viewBox="0 0 820 420" role="img" aria-label="Sunrise over mountains">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3b1d6e"/>
        <stop offset="0.45" stop-color="#e2566a"/>
        <stop offset="0.75" stop-color="#f7a35c"/>
        <stop offset="1" stop-color="#fde3a7"/>
      </linearGradient>
      <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#fff7d1"/>
        <stop offset="0.6" stop-color="#ffd166"/>
        <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f4a261"/>
        <stop offset="1" stop-color="#3d5a80"/>
      </linearGradient>
      <clipPath id="lake-clip">
        <rect x="0" y="300" width="820" height="120"/>
      </clipPath>
      <g id="pine">
        <path d="M0,-40 L14,-12 H7 L18,8 H-18 L-7,-12 H-14 Z" fill="#1f3b2d"/>
        <rect x="-3" y="8" width="6" height="10" fill="#3b2a1a"/>
      </g>
    </defs>

    <rect width="820" height="420" fill="url(#sky)"/>

    <!-- sun with rays -->
    <g transform="translate(560,230)">
      <g stroke="#ffe8a3" stroke-width="3" stroke-linecap="round" opacity="0.7">
        <line x1="0" y1="-95" x2="0" y2="-120"/>
        <line x1="0" y1="-95" x2="0" y2="-120" transform="rotate(25)"/>
        <line x1="0" y1="-95" x2="0" y2="-120" transform="rotate(50)"/>
        <line x1="0" y1="-95" x2="0" y2="-120" transform="rotate(75)"/>
        <line x1="0" y1="-95" x2="0" y2="-120" transform="rotate(-25)"/>
        <line x1="0" y1="-95" x2="0" y2="-120" transform="rotate(-50)"/>
        <line x1="0" y1="-95" x2="0" y2="-120" transform="rotate(-75)"/>
      </g>
      <circle r="90" fill="url(#sun)"/>
      <circle r="46" fill="#fff4c4"/>
    </g>

    <!-- clouds -->
    <g fill="#ffffff" opacity="0.55">
      <ellipse cx="160" cy="90" rx="70" ry="16"/>
      <ellipse cx="200" cy="78" rx="44" ry="18"/>
      <ellipse cx="680" cy="70" rx="60" ry="12"/>
    </g>

    <!-- mountain ranges -->
    <path d="M0,260 L110,170 L190,230 L300,130 L410,240 L470,200 L560,260 L650,180 L760,250 L820,220 V320 H0 Z" fill="#6b3f6e" opacity="0.85"/>
    <path d="M300,130 L330,155 L310,152 L292,168 L280,148 Z" fill="#f7e7f0" opacity="0.9"/>
    <path d="M0,290 L140,220 L260,280 L380,210 L520,290 L640,230 L820,300 V330 H0 Z" fill="#43284f"/>

    <!-- lake with reflection -->
    <rect x="0" y="300" width="820" height="120" fill="url(#lake)"/>
    <g clip-path="url(#lake-clip)" opacity="0.35">
      <ellipse cx="560" cy="330" rx="46" ry="10" fill="#fff4c4"/>
      <rect x="520" y="345" width="80" height="3" fill="#fff4c4"/>
      <rect x="535" y="356" width="50" height="3" fill="#fff4c4"/>
      <rect x="548" y="367" width="24" height="3" fill="#fff4c4"/>
    </g>

    <!-- shore and pines -->
    <path d="M0,330 C120,312 240,340 360,326 C460,315 520,340 620,330 C700,322 760,336 820,328 V420 H0 Z" fill="#20352a"/>
    <use href="#pine" x="60" y="320"/>
    <use href="#pine" x="96" y="330" transform="scale(1)"/>
    <use href="#pine" x="140" y="322"/>
    <g transform="translate(700,318) scale(1.4)"><use href="#pine"/></g>
    <g transform="translate(740,330) scale(1.1)"><use href="#pine"/></g>

    <!-- hiker silhouette -->
    <g transform="translate(400,318)" fill="#120a1f">
      <circle cx="0" cy="-34" r="5"/>
      <path d="M-4,-28 L4,-28 L6,-10 L10,4 L6,4 L2,-8 L-2,4 L-6,4 L-4,-10 Z"/>
      <rect x="-12" y="-27" width="8" height="12" rx="2"/>
      <line x1="8" y1="-20" x2="14" y2="4" stroke="#120a1f" stroke-width="1.5"/>
    </g>

    <text x="30" y="396" font-size="34" font-style="italic" fill="#fff8ee" opacity="0.92">Greetings from Lake Sorrel</text>
  </svg>
  <div class="note">
    <div>
      <h1>Dear Mira,</h1>
      <p>We left the hut at five and reached the ridge just as the sun cleared the far peaks. The lake turned from violet to gold in about ten minutes. Bringing you here next summer, no excuses.</p>
    </div>
    <div class="stamp"><b>42</b>Alpine Post<br>Sorrel Valley</div>
  </div>
</div>
</body>
</html>
