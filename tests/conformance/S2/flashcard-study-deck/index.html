<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spanish verbs — study deck</title>
<style>
  :root {
    --bg: #fdf6ec;
    --ink: #2d2a32;
    --muted: #807a86;
    --card: #fffdf9;
    --c1: #ff8f6b;
    --c2: #ffd166;
    --c3: #7bd389;
    --c4: #6cb4ee;
    --c5: #b39ddb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 28px 28px 36px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, sans-serif;
  }

  .top { display: flex; justify-content: space-between; align-items: center; }
  h1 { margin: 0; font-size: 26px; }
  .top p { margin: 4px 0 0; color: var(--muted); }
  .pill {
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font-weight: 600;
    font-size: 13px;
  }

  .stage {
    position: relative;
    height: 340px;
    margin: 20px 0 6px;
  }

  .card {
    position: absolute;
    left: 50%;
    bottom: 54px;
    width: 190px;
    height: 250px;
    margin-left: -95px;
    border-radius: 18px;
    background: var(--card);
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    padding: 18px 16px;
    transform-origin: 50% 120%;
    animation: deal 0.6s cubic-bezier(.2, .9, .3, 1.1) both;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 14px;
    right: 14px;
    top: 14px;
    height: 70px;
    border-radius: 10px;
    background: var(--tone);
  }
  .card .word {
    position: relative;
    margin-top: 92px;
    font-size: 24px;
    font-weight: 700;
  }
  .card .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .card .num {
    position: absolute;
    right: 16px;
    bottom: 12px;
    font-size: 12px;
    color: var(--muted);
  }

  .card:nth-child(1) { --tone: var(--c5); transform: rotate(-24deg); animation-delay: 0s; }
  .card:nth-child(2) { --tone: var(--c4); transform: rotate(-12deg); animation-delay: 0.06s; }
  .card:nth-child(3) { --tone: var(--c3); transform: rotate(0deg) translateY(-14px); animation-delay: 0.12s; }
  .card:nth-child(4) { --tone: var(--c2); transform: rotate(12deg); animation-delay: 0.18s; }
  .card:nth-child(5) { --tone: var(--c1); transform: rotate(24deg); animation-delay: 0.24s; }

  @keyframes deal {
    from { opacity: 0; translate: 0 60px; rotate: 8deg; }
  }

  .actions {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 26px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 12px;
    border: 2px solid var(--ink);
    background: var(--card);
    font-weight: 700;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .btn.primary { background: var(--c3); translate: -1px -1px; box-shadow: 4px 4px 0 var(--ink); }
  .btn .icon {
    width: 10px;
    height: 10px;
    border-right: 3px solid currentColor;
    border-bottom: 3px solid currentColor;
  }
  .btn .icon.left { transform: rotate(135deg); }
  .btn .icon.right { transform: rotate(-45deg); }
  .btn .icon.flip {
    border-radius: 50%;
    border: 3px solid currentColor;
    border-top-color: transparent;
    transform: rotate(45deg);
  }

  .progress {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .box {
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 14px;
  }
  .box .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .box .big { font-size: 26px; font-weight: 800; margin: 2px 0 8px; }
  .meter { height: 10px; border-radius: 5px; border: 2px solid var(--ink); overflow: hidden; }
  .meter span {
    display: block;
    height: 100%;
    width: 100%;
    background: var(--c3);
    transform-origin: left;
    scale: var(--v) 1;
  }
  .stamp {
    float: right;
    margin-top: -4px;
    padding: 2px 8px;
    border: 2px solid var(--c1);
    color: var(--c1);
    border-radius: 6px;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.08em;
    transform: rotate(8deg);
  }
</style>
</head>
<body>
  <div class="top">
    <div>
      <h1>Spanish verbs · Deck 3</h1>
      <p>Irregular preterite forms. 5 cards due today.</p>
    </div>
    <span class="pill">Session 12</span>
  </div>

  <div class="stage">
    <div class="card"><div class="word">poner</div><div class="hint">to put · puse</div><div class="num">1 / 5</div></div>
    <div class="card"><div class="word">decir</div><div class="hint">to say · dije</div><div class="num">2 / 5</div></div>
    <div class="card"><div class="word">tener</div><div class="hint">to have · tuve</div><div class="num">3 / 5</div></div>
    <div class="card"><div class="word">hacer</div><div class="hint">to do · hice</div><div class="num">4 / 5</div></div>
    <div class="card"><div class="word">venir</div><div class="hint">to come · vine</div><div class="num">5 / 5</div></div>
  </div>

  <div class="actions">
    <span class="btn"><span class="icon left"></span>Again</span>
    <span class="btn primary"><span class="icon flip"></span>Flip card</span>
    <span class="btn">Got it<span class="icon right"></span></span>
  </div>

  <div class="progress">
    <div class="box"><div class="label">Mastered <span class="stamp">NEW</span></div><div class="big">42 / 60</div><div class="meter"><span style="--v: 0.7"></span></div></div>
    <div class="box"><div class="label">Accuracy</div><div class="big">87%</div><div class="meter"><span style="--v: 0.87"></span></div></div>
    <div class="box"><div class="label">Today</div><div class="big">18 min</div><div class="meter"><span style="--v: 0.6"></span></div></div>
  </div>
</body>
</html>
