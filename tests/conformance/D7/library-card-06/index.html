<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas game 06</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#1f2937;font:16px/1.5 system-ui,sans-serif}main{max-width:720px;margin:0 auto;padding:32px 24px}section{background:white;border:1px solid #dbe3ef;border-radius:14px;padding:24px;box-shadow:0 4px 14px #1f293714}h1{margin:0 0 6px;font-size:26px}p{color:#64748b}.row{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding:14px;background:#f8fafc;border-radius:10px}.button{border:0;border-radius:8px;background:#2563eb;color:#fff;padding:9px 15px;font:inherit;cursor:pointer}.value{font-size:24px;font-weight:700;color:#0f766e}canvas{display:block;width:100%;height:220px;border:1px solid #dbe3ef;border-radius:10px;margin-top:18px}svg{display:block;width:100%;height:240px;margin-top:16px}.node{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.edge{stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.label{text-anchor:middle;font-weight:600;fill:#1e3a8a}</style></head><body><main><section><h1>Canvas game 06</h1><p>Move the blue square toward the green target.</p><canvas id="plot" width="640" height="220"></canvas><div class="row"><span>Token position</span><button class="button" id="b" data-action="increment">Move right <span id="value">80</span></button></div></section></main><div id="react-root"></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js" integrity="sha384-AvQiDMZAVLda3VtAoU5MCfBz8pzXhteb2CiUJeKBmPlWzpXj1uJ96Km11+YuFNu/" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script><script>const e=React.createElement;function App(){const [value,setValue]=React.useState(0);return e(React.Fragment,null,e("div",{style:{display:"none"}},value),e("button",{style:{display:"none"},id:"hidden",onClick:()=>setValue(value+1)},""),e("script",null,""))};ReactDOM.createRoot(document.getElementById("react-root")).render(e(App));</script><script>
new Phaser.Game({
  type: Phaser.CANVAS,
  canvas: document.getElementById('plot'),
  width: 640,
  height: 220,
  banner: false,
  audio: { noAudio: true },
  backgroundColor: '#eff6ff',
  scene: {
    create() {
      const token = this.add.rectangle(80, 110, 28, 28, 0x2563eb);
      this.add.rectangle(400, 110, 36, 36, 0x0f766e);
      document.getElementById('plot').setAttribute('data-scene-ready', 'true');
      document.getElementById('b').addEventListener('click', () => {
        token.x = Phaser.Math.Clamp(token.x + 50, 14, 626);
        document.getElementById('value').textContent = String(token.x);
      });
    }
  }
});
</script></body></html>
