<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGL Framebuffer Offscreen Pass</title>
<style>
  :root {
    --bg: #0b0f19;
    --panel: #131b2e;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --border: #1e293b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 760px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: 18px;
    letter-spacing: 0.05em;
    color: var(--accent);
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }
  button {
    background: #1e293b;
    border: 1px solid #334155;
    color: #f1f5f9;
    padding: 6px 14px;
    border-radius: 6px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #334155; }
  .badge { color: var(--muted); }
  output { color: #f8fafc; font-weight: 600; }
  canvas {
    display: block;
    width: 100%;
    height: 380px;
    background: #050811;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>WebGL Framebuffer Offscreen Pass</h1>
    <div class="controls">
      <button id="filter-btn">Invert Effect</button>
      <span class="badge">Effect: <output id="filter-mode">normal</output></span>
      <span class="badge">FBO: <output id="fbo-status">rendered</output></span>
    </div>
  </div>
  <canvas id="glcanvas" width="720" height="380"></canvas>
</div>

<script>
(function() {
  const canvas = document.getElementById('glcanvas');
  const filterBtn = document.getElementById('filter-btn');
  const filterMode = document.getElementById('filter-mode');
  const fboStatus = document.getElementById('fbo-status');

  let inverted = false;

  filterBtn.addEventListener('click', () => {
    inverted = !inverted;
    filterMode.textContent = inverted ? 'inverted' : 'normal';
    renderScene();
  });

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;

  const vsSource = `
    attribute vec2 a_pos;
    varying vec2 v_uv;
    void main() {
      v_uv = a_pos * 0.5 + 0.5;
      gl_Position = vec4(a_pos, 0.0, 1.0);
    }
  `;

  const fsSource = `
    precision mediump float;
    varying vec2 v_uv;
    uniform int u_invert;
    void main() {
      vec3 col = vec3(v_uv.x * 0.8, 0.4, v_uv.y * 0.9);
      if (u_invert == 1) {
        col = vec3(1.0) - col;
      }
      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  const vs = createShader(gl.VERTEX_SHADER, vsSource);
  const fs = createShader(gl.FRAGMENT_SHADER, fsSource);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const quad = new Float32Array([
    -0.8, -0.8,
     0.8, -0.8,
    -0.8,  0.8,
    -0.8,  0.8,
     0.8, -0.8,
     0.8,  0.8
  ]);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

  const posLoc = gl.getAttribLocation(prog, 'a_pos');
  const invLoc = gl.getUniformLocation(prog, 'u_invert');

  if (posLoc >= 0) {
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
  }

  const fbo = gl.createFramebuffer();
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);

  // Render to offscreen FBO
  gl.viewport(0, 0, 256, 256);
  gl.clearColor(0.2, 0.1, 0.4, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  fboStatus.textContent = 'rendered';

  // Render to canvas
  function renderScene() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.04, 0.06, 0.12, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    if (invLoc !== null) {
      gl.uniform1i(invLoc, inverted ? 1 : 0);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 6);
  }

  renderScene();
})();
</script>
</body>
</html>
