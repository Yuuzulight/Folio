<!doctype html><canvas id="c" width="800" height="450"></canvas><output id="status">ready</output><output id="result" style="display:none"></output><script>
const canvas=document.getElementById('c'), status=document.getElementById('status'), result=document.getElementById('result'); const gl=canvas.getContext('webgl'); const loss=gl&&gl.getExtension('WEBGL_lose_context'); result.textContent=gl&&loss?'context-ready':'context-failed'; if(gl){ gl.oncontextlost=()=>status.textContent='lost'; gl.oncontextrestored=()=>status.textContent='restored'; } if(loss){ loss.loseContext(); setTimeout(()=>loss.restoreContext(),0); }
</script>
