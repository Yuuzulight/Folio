<!doctype html><canvas id="c" width="800" height="450"></canvas><output id="status">ready</output><output id="result" style="display:none"></output><script>
const canvas=document.getElementById('c'), status=document.getElementById('status'), result=document.getElementById('result'); const gl=canvas.getContext('webgl'); result.textContent=gl?'context-ready':'context-failed'; canvas.addEventListener('webglcontextlost',()=>status.textContent='lost'); canvas.addEventListener('webglcontextrestored',()=>status.textContent='restored');
</script>
