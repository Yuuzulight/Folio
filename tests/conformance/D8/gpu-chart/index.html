<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Multi-Series Line Chart</title>
<style>
  :root {
    --bg: #0b0f19;
    --panel: #131b2e;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --border: #1e293b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 760px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: 18px;
    letter-spacing: 0.05em;
    color: var(--accent);
  }
  .legend {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  button {
    background: #1e293b;
    border: 1px solid #334155;
    color: #f1f5f9;
    padding: 6px 12px;
    border-radius: 6px;
    font: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  button:hover { background: #334155; }
  button.inactive {
    opacity: 0.45;
    text-decoration: line-through;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .dot-alpha { background: #38bdf8; }
  .dot-beta { background: #f43f5e; }
  .dot-gamma { background: #fbbf24; }
  .badge { color: var(--muted); }
  output { color: #f8fafc; font-weight: 600; }
  canvas {
    display: block;
    width: 100%;
    height: 380px;
    background: #050811;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>GPU Multi-Series Line Chart</h1>
    <div class="legend">
      <button id="toggle-s1"><span class="dot dot-alpha"></span>Alpha</button>
      <button id="toggle-s2"><span class="dot dot-beta"></span>Beta</button>
      <button id="toggle-s3"><span class="dot dot-gamma"></span>Gamma</button>
      <span class="badge">Active: <output id="visible-series">Alpha,Beta,Gamma</output></span>
    </div>
  </div>
  <canvas id="glcanvas" width="720" height="380"></canvas>
</div>

<script>
(function() {
  const canvas = document.getElementById('glcanvas');
  const t1 = document.getElementById('toggle-s1');
  const t2 = document.getElementById('toggle-s2');
  const t3 = document.getElementById('toggle-s3');
  const visibleOutput = document.getElementById('visible-series');

  const visible = { Alpha: true, Beta: true, Gamma: true };

  function updateVisibleOutput() {
    const list = [];
    if (visible.Alpha) list.push('Alpha');
    if (visible.Beta) list.push('Beta');
    if (visible.Gamma) list.push('Gamma');
    visibleOutput.textContent = list.join(',');
    t1.classList.toggle('inactive', !visible.Alpha);
    t2.classList.toggle('inactive', !visible.Beta);
    t3.classList.toggle('inactive', !visible.Gamma);
    drawChart();
  }

  t1.addEventListener('click', () => { visible.Alpha = !visible.Alpha; updateVisibleOutput(); });
  t2.addEventListener('click', () => { visible.Beta = !visible.Beta; updateVisibleOutput(); });
  t3.addEventListener('click', () => { visible.Gamma = !visible.Gamma; updateVisibleOutput(); });

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;

  const vsSource = `
    attribute vec2 a_pos;
    void main() {
      gl_Position = vec4(a_pos.x * 2.0 - 1.0, a_pos.y * 2.0 - 1.0, 0.0, 1.0);
    }
  `;
  const fsSource = `
    precision mediump float;
    uniform vec4 u_color;
    void main() {
      gl_FragColor = u_color;
    }
  `;

  function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  const vs = createShader(gl.VERTEX_SHADER, vsSource);
  const fs = createShader(gl.FRAGMENT_SHADER, fsSource);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const posLoc = gl.getAttribLocation(prog, 'a_pos');
  const colorLoc = gl.getUniformLocation(prog, 'u_color');

  function makeSeries(fn) {
    const pts = [];
    const n = 64;
    for (let i = 0; i <= n; i++) {
      const x = 0.08 + (i / n) * 0.84;
      const t = (i / n) * Math.PI * 2;
      const y = fn(t);
      pts.push(x, 0.15 + y * 0.7);
    }
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pts), gl.STATIC_DRAW);
    return { buf, count: pts.length / 2 };
  }

  const seriesAlpha = makeSeries(t => 0.45 + 0.35 * Math.sin(t));
  const seriesBeta  = makeSeries(t => 0.50 + 0.30 * Math.cos(t * 1.5));
  const seriesGamma = makeSeries(t => 0.25 + 0.50 * (t / (Math.PI * 2)));

  function drawSeries(s, color) {
    gl.bindBuffer(gl.ARRAY_BUFFER, s.buf);
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
    gl.uniform4fv(colorLoc, color);
    gl.drawArrays(gl.LINE_STRIP, 0, s.count);
  }

  function drawChart() {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.04, 0.06, 0.12, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    if (visible.Alpha) drawSeries(seriesAlpha, [0.22, 0.74, 0.97, 1.0]);
    if (visible.Beta)  drawSeries(seriesBeta,  [0.96, 0.25, 0.37, 1.0]);
    if (visible.Gamma) drawSeries(seriesGamma, [0.98, 0.75, 0.14, 1.0]);
  }

  drawChart();
})();
</script>
</body>
</html>
