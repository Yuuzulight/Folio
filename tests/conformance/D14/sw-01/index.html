<!doctype html><html><body><main id="app"><h1>Offline asset cache</h1><p id="status">service worker pending</p><output id="probe" style="display:none"></output></main><script>if (navigator.serviceWorker) navigator.serviceWorker.register("sw.js").then(function(){document.getElementById("status").textContent="ready";return fetch("offline.txt");}).then(function(response){return response.text();}).then(function(text){document.getElementById("probe").textContent=text;},function(){document.getElementById("status").textContent="failed";});</script></body></html>
