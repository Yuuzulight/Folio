<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantry</title>
<style>
  :root { --bg: #f4efe6; --card: #fffdf8; --ink: #2b2620; --muted: #8b8070; --accent: #2f7d5b; --warn: #b4531f; --line: #e6dccb; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
  .card { max-width: 560px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; box-shadow: 0 8px 24px rgba(60, 45, 20, .08); }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 24px; }
  header p { margin: 0; font-size: 14px; font-weight: 600; }
  .ok { color: var(--accent); }
  .alert { color: var(--warn); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  ul { list-style: none; margin: 0; padding: 0; }
  .row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row.low .name { color: var(--warn); font-weight: 600; }
  .cat { font-size: 12px; color: var(--muted); }
  .stepper { display: inline-flex; align-items: center; gap: 8px; }
  .stepper button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font: inherit; cursor: pointer; }
  .stepper button:disabled { opacity: .4; }
  output { min-width: 20px; text-align: center; font-variant-numeric: tabular-nums; }
  footer { margin-top: 12px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js" integrity="sha384-x/ilTFv/u/eu6YSmkFDZl5V5Mm/pkxxcVv2cVJOrr1J0rvILhMvRBCy6yA75wYBj" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState } = React;

const STOCK = [
  { id: 1, name: 'Basmati rice', cat: 'Grains', qty: 3, min: 2 },
  { id: 2, name: 'Rolled oats', cat: 'Grains', qty: 1, min: 2 },
  { id: 3, name: 'Olive oil', cat: 'Oils', qty: 2, min: 1 },
  { id: 4, name: 'Sesame oil', cat: 'Oils', qty: 1, min: 1 },
  { id: 5, name: 'Chickpeas', cat: 'Tins', qty: 6, min: 4 },
  { id: 6, name: 'Coconut milk', cat: 'Tins', qty: 2, min: 3 },
  { id: 7, name: 'Cumin seeds', cat: 'Spices', qty: 1, min: 1 },
  { id: 8, name: 'Smoked paprika', cat: 'Spices', qty: 0, min: 1 },
];

const CATEGORIES = ['All', 'Grains', 'Oils', 'Tins', 'Spices'];

function Row({ item, onChange }) {
  const low = item.qty <= item.min;
  return (
    <li className={'row' + (low ? ' low' : '')} data-id={item.id}>
      <span className="name">{item.name}</span>
      <span className="cat">{item.cat}</span>
      <span className="stepper">
        <button aria-label="less" onClick={() => onChange(item.id, -1)} disabled={item.qty === 0}>&minus;</button>
        <output>{item.qty}</output>
        <button aria-label="more" onClick={() => onChange(item.id, 1)}>+</button>
      </span>
    </li>
  );
}

function App() {
  const [items, setItems] = useState(STOCK);
  const [cat, setCat] = useState('All');
  const change = (id, by) => setItems(items.map(i => i.id === id ? { ...i, qty: Math.max(0, i.qty + by) } : i));
  const shown = items.filter(i => cat === 'All' || i.cat === cat);
  const low = items.filter(i => i.qty <= i.min).length;
  return (
    <main className="card">
      <header>
        <h1>Pantry</h1>
        <p className={low ? 'alert' : 'ok'}>{low === 0 ? 'Everything is stocked' : low + ' item' + (low === 1 ? '' : 's') + ' to restock'}</p>
      </header>
      <nav className="chips">
        {CATEGORIES.map(c => (
          <button key={c} data-chip={c} className={'chip' + (c === cat ? ' on' : '')} onClick={() => setCat(c)}>{c}</button>
        ))}
      </nav>
      <ul>{shown.map(i => <Row key={i.id} item={i} onChange={change} />)}</ul>
      <footer>{shown.length} of {items.length} items shown</footer>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
