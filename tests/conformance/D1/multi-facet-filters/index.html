<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Catalog Filters</title>
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --brand: #6366f1;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 30px;
  }
  .layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 24px;
    max-width: 900px;
    margin: 0 auto;
  }
  aside {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    height: fit-content;
  }
  h3 { margin-top: 0; font-size: 16px; margin-bottom: 12px; }
  .filter-group {
    margin-bottom: 20px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
  }
  .filter-group:last-of-type { border-bottom: none; margin-bottom: 12px; }
  .check-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  #filter-count { font-weight: 600; font-size: 15px; }
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .product-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .product-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .product-meta { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .product-price { font-weight: 700; color: var(--brand); font-size: 16px; }
  .reset-btn {
    width: 100%;
    padding: 8px;
    background: #f1f5f9;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
  }
  .reset-btn:hover { background: #e2e8f0; }
</style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="filter-group">
        <h3>Categories</h3>
        <label class="check-item"><input type="checkbox" name="cat" value="Electronics"> Electronics</label>
        <label class="check-item"><input type="checkbox" name="cat" value="Accessories"> Accessories</label>
        <label class="check-item"><input type="checkbox" name="cat" value="Office"> Office</label>
      </div>
      <div class="filter-group">
        <h3>Availability</h3>
        <label class="check-item"><input type="checkbox" id="in-stock-only"> In Stock Only</label>
      </div>
      <button class="reset-btn" id="btn-reset-filters">Reset Filters</button>
    </aside>
    <main>
      <div class="top-bar">
        <span id="filter-count">8 products found</span>
      </div>
      <div class="cards-grid" id="products-grid"></div>
    </main>
  </div>
<script>
  const items = [
    { name: "Wireless Mechanical Keyboard", cat: "Electronics", price: 120, stock: true },
    { name: "Noise Cancelling Headphones", cat: "Electronics", price: 250, stock: true },
    { name: "USB-C Multiport Dock", cat: "Electronics", price: 80, stock: false },
    { name: "Leather Desk Pad", cat: "Accessories", price: 35, stock: true },
    { name: "Ergonomic Wrist Rest", cat: "Accessories", price: 25, stock: true },
    { name: "Cable Management Sleeve", cat: "Accessories", price: 15, stock: false },
    { name: "Adjustable Monitor Arm", cat: "Office", price: 110, stock: true },
    { name: "Standing Desk Converter", cat: "Office", price: 180, stock: true }
  ];

  const grid = document.getElementById('products-grid');
  const countEl = document.getElementById('filter-count');
  const catBoxes = document.querySelectorAll("input[name='cat']");
  const stockBox = document.getElementById('in-stock-only');
  const resetBtn = document.getElementById('btn-reset-filters');

  function render() {
    const selectedCats = Array.from(catBoxes).filter(b => b.checked).map(b => b.value);
    const inStock = stockBox.checked;

    const filtered = items.filter(it => {
      if (selectedCats.length > 0 && !selectedCats.includes(it.cat)) return false;
      if (inStock && !it.stock) return false;
      return true;
    });

    countEl.textContent = `${filtered.length} products found`;
    grid.innerHTML = filtered.map(it => `
      <div class="product-card">
        <div class="product-name">${it.name}</div>
        <div class="product-meta">${it.cat} · ${it.stock ? 'In Stock' : 'Out of Stock'}</div>
        <div class="product-price">$${it.price}</div>
      </div>
    `).join('');
  }

  catBoxes.forEach(b => b.addEventListener('change', render));
  stockBox.addEventListener('change', render);
  resetBtn.addEventListener('click', () => {
    catBoxes.forEach(b => b.checked = false);
    stockBox.checked = false;
    render();
  });

  render();
</script>
</body>
</html>
