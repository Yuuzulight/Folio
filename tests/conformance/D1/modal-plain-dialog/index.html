<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmation Modal</title>
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --danger: #ef4444;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 60px 20px;
    display: flex;
    justify-content: center;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.05);
  }
  h2 { margin-top: 0; font-size: 20px; }
  p.desc { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .btn-trigger {
    background: var(--danger);
    color: #ffffff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .status-badge {
    margin-top: 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    background: var(--card);
    border-radius: var(--radius);
    width: 100%;
    max-width: 400px;
    padding: 24px;
    text-align: left;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
  }
  .modal-header h3 { margin: 0 0 8px; font-size: 18px; }
  .modal-body { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .btn-sec {
    background: #f1f5f9;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 8px 16px;
    border-radius: 6px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-prim {
    background: var(--danger);
    color: #ffffff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="panel">
    <h2>Project Settings</h2>
    <p class="desc">Permanently remove this deployment repository and all artifact logs.</p>
    <button class="btn-trigger" id="btn-open-modal">Delete Repository</button>
    <div class="status-badge" id="action-status">Ready</div>
  </div>

  <div class="modal-overlay" id="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Confirm Deletion</h3>
      </div>
      <div class="modal-body">
        Are you sure you want to permanently delete this repository? This action cannot be undone.
      </div>
      <div class="modal-footer">
        <button class="btn-sec" id="btn-modal-cancel">Cancel</button>
        <button class="btn-prim" id="btn-modal-confirm">Confirm</button>
      </div>
    </div>
  </div>
<script>
  const openBtn = document.getElementById('btn-open-modal');
  const overlay = document.getElementById('modal-overlay');
  const cancelBtn = document.getElementById('btn-modal-cancel');
  const confirmBtn = document.getElementById('btn-modal-confirm');
  const statusEl = document.getElementById('action-status');

  openBtn.addEventListener('click', () => {
    overlay.hidden = false;
  });

  function close() {
    overlay.hidden = true;
  }

  cancelBtn.addEventListener('click', () => {
    close();
    statusEl.textContent = 'Cancelled';
  });

  confirmBtn.addEventListener('click', () => {
    close();
    statusEl.textContent = 'Confirmed';
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !overlay.hidden) {
      close();
      statusEl.textContent = 'Cancelled';
    }
  });
</script>
</body>
</html>
