<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Maze Adventure</title>
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #cbd5e1;
    --player: #3b82f6;
    --coin: #eab308;
    --goal: #10b981;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 30px;
    display: flex;
    justify-content: center;
  }
  .game-container {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.05);
  }
  h2 { margin-top: 0; font-size: 20px; }
  .stats-bar {
    display: flex;
    gap: 24px;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 52px);
    grid-template-rows: repeat(5, 52px);
    gap: 6px;
    background: #f1f5f9;
    padding: 8px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
  }
  .cell {
    background: #ffffff;
    border-radius: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 16px;
  }
  .cell.player { background: var(--player); color: #fff; }
  .cell.coin { background: #fef9c3; color: var(--coin); }
  .cell.goal { background: #d1fae5; color: var(--goal); }
  .controls-row {
    margin-top: 20px;
  }
  button {
    background: #f1f5f9;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 16px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #e2e8f0; }
</style>
</head>
<body>
  <div class="game-container">
    <h2>Grid Maze Collector</h2>
    <div class="stats-bar">
      <div>Score: <span id="score">0</span></div>
      <div>Moves: <span id="moves">0</span></div>
    </div>
    <div class="grid" id="game-grid"></div>
    <div class="controls-row">
      <button id="btn-reset-game">Reset Game</button>
    </div>
  </div>
<script>
  let px = 0, py = 0;
  let score = 0;
  let moves = 0;
  let coins = [{x: 2, y: 1}, {x: 4, y: 2}, {x: 1, y: 3}];
  const goal = {x: 4, y: 4};

  const grid = document.getElementById('game-grid');
  const scoreEl = document.getElementById('score');
  const movesEl = document.getElementById('moves');
  const resetBtn = document.getElementById('btn-reset-game');

  function render() {
    grid.innerHTML = '';
    for (let y = 0; y < 5; y++) {
      for (let x = 0; x < 5; x++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (x === px && y === py) {
          cell.className += ' player';
          cell.textContent = 'P';
        } else if (coins.some(c => c.x === x && c.y === y)) {
          cell.className += ' coin';
          cell.textContent = 'C';
        } else if (x === goal.x && y === goal.y) {
          cell.className += ' goal';
          cell.textContent = 'G';
        }
        grid.appendChild(cell);
      }
    }
    scoreEl.textContent = String(score);
    movesEl.textContent = String(moves);
  }

  function move(dx, dy) {
    const nx = px + dx;
    const ny = py + dy;
    if (nx >= 0 && nx < 5 && ny >= 0 && ny < 5) {
      px = nx;
      py = ny;
      moves++;
      const ci = coins.findIndex(c => c.x === px && c.y === py);
      if (ci !== -1) {
        coins.splice(ci, 1);
        score += 10;
      }
      render();
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') move(1, 0);
    else if (e.key === 'ArrowLeft') move(-1, 0);
    else if (e.key === 'ArrowDown') move(0, 1);
    else if (e.key === 'ArrowUp') move(0, -1);
  });

  resetBtn.addEventListener('click', () => {
    px = 0; py = 0;
    score = 0; moves = 0;
    coins = [{x: 2, y: 1}, {x: 4, y: 2}, {x: 1, y: 3}];
    render();
  });

  render();
</script>
</body>
</html>
