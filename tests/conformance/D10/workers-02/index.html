<!doctype html><meta charset='utf-8'><title>Canvas image filter</title><main><h1>Worker image filter</h1><canvas id="canvas" width="160" height="90"></canvas><output id="status">ready</output><script>const ctx=document.getElementById("canvas").getContext("2d");ctx.fillStyle="#38bdf8";ctx.fillRect(0,0,160,90);const status=document.getElementById("status");const w=new Worker("worker.js");w.onmessage=()=>status.textContent="filtered";w.postMessage(0);</script></main>
