<!doctype html><meta charset='utf-8'><title>Canvas image filter</title><main><h1>Worker image filter</h1><canvas id="canvas" width="160" height="90"></canvas><output id="status">ready</output><script>const ctx=canvas.getContext("2d");ctx.fillStyle="#38bdf8";ctx.fillRect(0,0,160,90);const w=new Worker("data:text/javascript,postMessage({ok:true})");w.onmessage=()=>status.textContent="filtered";</script></main>
