<!doctype html><html><body><video id="preview" autoplay></video><button id="start">Start</button><p id="status">Camera preview permission</p><output id="result" style="display:none"></output><script>document.getElementById("start").onclick=function(){navigator.mediaDevices.getUserMedia({video:true}).then(function(stream){document.getElementById("preview").srcObject=stream;document.getElementById("result").textContent=stream.getVideoTracks()[0].kind;});document.getElementById("status").textContent+=" ready";};</script></body></html>
