<!doctype html><html><body><video id="preview" autoplay></video><button id="start">Start</button><p id="status">Data channel chat</p><output id="result" style="display:none"></output><script>document.getElementById("start").onclick=function(){var offerer=new RTCPeerConnection(),answerer=new RTCPeerConnection(),channel=offerer.createDataChannel("chat");offerer.createOffer().then(function(offer){return offerer.setLocalDescription(offer).then(function(){return answerer.setRemoteDescription(offer);});}).then(function(){return answerer.createAnswer();}).then(function(answer){return answerer.setLocalDescription(answer).then(function(){return offerer.setRemoteDescription(answer);});}).then(function(){document.getElementById("result").textContent="channel-created";});document.getElementById("status").textContent+=" ready";};</script></body></html>
