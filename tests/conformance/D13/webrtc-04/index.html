<!doctype html><html><body><video id="preview" autoplay></video><button id="start">Start</button><p id="status">Microphone level meter</p><output id="result" style="display:none"></output><script>document.getElementById("start").onclick=function(){navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){document.getElementById("result").textContent=stream.getAudioTracks()[0].kind;});document.getElementById("status").textContent+=" ready";};</script></body></html>
