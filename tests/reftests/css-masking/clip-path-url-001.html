<!DOCTYPE html>
<title>clip-path: url() to a clipPath of one rectangle clips a box to it, in the border box's coordinates</title>
<link rel="help" href="https://drafts.csswg.org/css-masking-1/#the-clip-path">
<style>
  body { margin: 0; }
  div { display: flow-root; width: 100px; height: 60px; background: blue; clip-path: url(#c); }
  span { display: block; margin: 20px 0 0 20px; width: 200px; height: 10px; background: orange; }
</style>
<svg width="0" height="0" style="position: absolute"><clipPath id="c"><rect x="10" y="10" width="80" height="40" /></clipPath></svg>
<div><span></span></div>
