<!DOCTYPE html>
<title>clip-path: url() to a clipPath of two shapes keeps the box in their union, in bounding box units</title>
<link rel="help" href="https://drafts.csswg.org/css-masking-1/#the-clip-path">
<link rel="help" href="https://drafts.csswg.org/css-masking-1/#element-attrdef-clippath-clippathunits">
<style>
  body { margin: 0; }
  div { margin: 10px; width: 100px; height: 60px; background: blue; clip-path: url(#halves); }
</style>
<svg width="0" height="0" style="position: absolute">
  <clipPath id="halves" clipPathUnits="objectBoundingBox"><rect width="0.4" height="1" /><rect x="0.6" width="0.4" height="0.5" /></clipPath>
</svg>
<div></div>
