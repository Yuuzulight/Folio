<!DOCTYPE html>
<title>opacity() composites the element and its content as a group, like the opacity property</title>
<link rel="help" href="https://drafts.csswg.org/filter-effects-1/#funcdef-filter-opacity">
<style>
  body { margin: 0; }
  .group { width: 60px; height: 40px; background: blue; border: 4px solid green; }
  span { display: block; margin: 10px; width: 50px; height: 30px; background: orange; }
</style>
<div class="group" style="filter: opacity(0.5)"><span></span></div>
<div class="group" style="filter: opacity(25%); margin-top: -20px"><span></span></div>
