<!DOCTYPE html>
<title>filter: url() to a filter element filters a box in its border box's coordinates, inside the filter region</title>
<link rel="help" href="https://drafts.csswg.org/filter-effects-1/#FilterProperty">
<style>
  body { margin: 0; }
  div { margin: 10px; width: 100px; height: 40px; background: blue; filter: url(#move); }
</style>
<svg width="0" height="0" style="position: absolute"><filter id="move" filterUnits="userSpaceOnUse" x="0" y="0" width="80" height="40"><feOffset dx="20" /></filter></svg>
<div></div>
