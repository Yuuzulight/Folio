<!DOCTYPE html>
<title>Hard colour stops in linear and repeating linear gradients</title>
<link rel="help" href="https://www.w3.org/TR/css-images-3/#color-stop-syntax">
<style>
  body { margin: 0; }
  div { width: 100px; height: 20px; }
</style>
<div style="background: linear-gradient(to right, red 50%, blue 50%)"></div>
<div style="background: linear-gradient(to bottom, lime 0 50%, black 0)"></div>
<div style="background: repeating-linear-gradient(to right, red 0 20px, blue 20px 40px)"></div>
