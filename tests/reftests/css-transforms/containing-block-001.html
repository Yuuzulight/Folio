<!DOCTYPE html>
<title>A transformed box is the containing block of its absolute and fixed descendants, which move with it</title>
<link rel="help" href="https://www.w3.org/TR/css-transforms-1/#transform-rendering">
<style>
  body { margin: 0; }
  .t { margin: 10px; width: 50px; height: 50px; padding: 5px; background: yellow; transform: translate(20px, 10px); }
  .t div { width: 10px; height: 10px; }
</style>
<div class="t">
  <div style="position: fixed; right: 0; bottom: 0; background: blue"></div>
  <div style="position: absolute; left: 0; top: 0; background: green"></div>
</div>
