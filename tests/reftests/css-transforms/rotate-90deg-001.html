<!DOCTYPE html>
<title>rotate(90deg) of a square about its centre covers the unrotated square</title>
<link rel="help" href="https://www.w3.org/TR/css-transforms-1/#funcdef-transform-rotate">
<style>
  body { margin: 0; }
  div { margin: 10px; width: 40px; height: 40px; background: blue; }
</style>
<div style="transform: rotate(90deg)"></div>
<div style="rotate: 90deg"></div>
