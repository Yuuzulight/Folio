<!DOCTYPE html>
<title>Reference: a relatively positioned box with both children absolutely positioned in it</title>
<style>
  body { margin: 0; }
  .t { margin: 10px; width: 50px; height: 50px; padding: 5px; background: yellow; position: relative; left: 20px; top: 10px; }
  .t div { width: 10px; height: 10px; position: absolute; }
</style>
<div class="t">
  <div style="right: 0; bottom: 0; background: blue"></div>
  <div style="left: 0; top: 0; background: green"></div>
</div>
