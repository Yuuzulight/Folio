<!DOCTYPE html>
<title>Reference: the boxes positioned relatively by the same offsets</title>
<style>
  body { margin: 0; }
  div { width: 30px; height: 30px; background: blue; border: 3px solid green; position: relative; }
  span { display: block; width: 10px; height: 10px; background: orange; }
</style>
<div style="left: 10px; top: 20px"><span></span></div>
<div style="left: 5px; top: 7px"><span></span></div>
