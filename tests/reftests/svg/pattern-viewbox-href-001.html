<!DOCTYPE html>
<title>a viewBox scales the content into the tile, and href brings in another pattern's content</title>
<link rel="help" href="https://www.w3.org/TR/SVG2/pservers.html#PatternElement">
<style>body { margin: 0 } svg { display: block }</style>
<svg width="100" height="60"><pattern id="base" viewBox="0 0 2 2"><rect width="1" height="1" fill="green" /></pattern><pattern id="p" href="#base" patternUnits="userSpaceOnUse" width="20" height="20" /><rect width="100" height="60" fill="url(#p)" /></svg>
