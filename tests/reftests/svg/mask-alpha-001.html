<!DOCTYPE html>
<title>An alpha mask in bounding box units keeps the content where its content is opaque, whatever its colour</title>
<link rel="help" href="https://drafts.csswg.org/css-masking-1/#the-mask-type">
<link rel="help" href="https://drafts.csswg.org/css-masking-1/#element-attrdef-mask-maskcontentunits">
<style>body { margin: 0 } svg { display: block } mask { mask-type: alpha }</style>
<svg width="200" height="100"><mask id="m" maskContentUnits="objectBoundingBox"><rect width="0.5" height="1" fill="black" /></mask><rect x="20" y="10" width="100" height="60" fill="blue" mask="url(#m)" /></svg>
