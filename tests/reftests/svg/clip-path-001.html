<!DOCTYPE html>
<title>A clip path of one rectangle leaves that part of the content</title>
<link rel="help" href="https://drafts.csswg.org/css-masking-1/#ClipPathElement">
<style>body { margin: 0 } svg { display: block }</style>
<svg width="200" height="100"><clipPath id="c"><rect x="10" y="20" width="30" height="40" /></clipPath><rect width="200" height="100" fill="blue" clip-path="url(#c)" /></svg>
