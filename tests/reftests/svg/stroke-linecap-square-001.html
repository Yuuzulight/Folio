<!DOCTYPE html>
<title>A square cap extends the line by half the stroke width</title>
<link rel="help" href="https://www.w3.org/TR/SVG2/painting.html#LineCaps">
<style>body { margin: 0 } svg { display: block }</style>
<svg width="200" height="100"><line x1="10" y1="20" x2="50" y2="20" stroke="blue" stroke-width="10" stroke-linecap="square" /></svg>
