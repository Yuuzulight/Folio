<!DOCTYPE html>
<title>Dashes start at the start of the line, with butt caps</title>
<link rel="help" href="https://www.w3.org/TR/SVG2/painting.html#StrokeDasharrayProperty">
<style>body { margin: 0 } svg { display: block }</style>
<svg width="200" height="100"><line x1="0" y1="10" x2="100" y2="10" stroke="blue" stroke-width="10" stroke-dasharray="20 10" /></svg>
