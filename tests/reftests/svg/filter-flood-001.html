<!DOCTYPE html>
<title>A flood fills its subregion in the filter region around the bounding box, whatever the element draws</title>
<link rel="help" href="https://drafts.csswg.org/filter-effects-1/#feFloodElement">
<link rel="help" href="https://drafts.csswg.org/filter-effects-1/#FilterPrimitiveSubRegion">
<style>body { margin: 0 } svg { display: block }</style>
<svg width="200" height="100"><filter id="f" primitiveUnits="objectBoundingBox"><feFlood flood-color="blue" x="0.5" width="0.5" /></filter><rect x="20" y="10" width="100" height="50" fill="red" filter="url(#f)" /></svg>
