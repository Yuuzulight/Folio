<!DOCTYPE html>
<title>mix-blend-mode: normal paints like no blending</title>
<link rel="help" href="https://drafts.csswg.org/compositing-2/#mix-blend-mode">
<style>
  body { margin: 0; background: linear-gradient(90deg, yellow, teal); }
  div { width: 60px; height: 40px; }
  .a { background: rgb(200 30 90 / 0.6); }
  .b { margin: -20px 0 0 30px; background: rgb(20 60 200 / 0.7); border-radius: 10px; }
</style>
<div class="a" style="mix-blend-mode: normal"></div>
<div class="b" style="mix-blend-mode: normal"></div>
<div class="a" style="background-blend-mode: normal; background-image: linear-gradient(red, transparent)"></div>
