<!DOCTYPE html>
<title>::first-letter styles the first letter, with the punctuation around it</title>
<link rel="help" href="https://www.w3.org/TR/css-pseudo-4/#first-letter-pseudo">
<style>
  body { margin: 0; }
  p { margin: 0; }
  p::first-letter { color: blue; font-size: 32px; }
</style>
<p>"a" bc</p>
