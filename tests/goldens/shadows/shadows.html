<!DOCTYPE html>
<title>Box and text shadows</title>
<style>
  body { margin: 24px; font-size: 20px; }
  .row { display: flex; gap: 32px; margin-bottom: 32px; }
  .box { width: 80px; height: 60px; background: #f8fafc; border: 1px solid #cbd5e1; }
  p { margin: 0 0 16px; }
</style>
<div class="row">
  <div class="box" style="box-shadow: 0 4px 12px rgb(15 23 42 / 0.35)"></div>
  <div class="box" style="border-radius: 12px; box-shadow: 0 0 0 4px #6366f1, 0 10px 20px -4px rgb(0 0 0 / 0.5)"></div>
  <div class="box" style="box-shadow: inset 0 2px 8px rgb(0 0 0 / 0.45)"></div>
  <div class="box" style="border-radius: 50%; box-shadow: 8px 8px 0 #f59e0b, inset -6px -6px 0 2px #0ea5e9"></div>
</div>
<p style="color: #0f172a; text-shadow: 2px 2px 0 #f59e0b">Offset text shadow</p>
<p style="color: white; text-shadow: 0 0 6px #0f172a, 0 0 2px #0f172a">Blurred text shadow</p>
