<!DOCTYPE html>
<title>Filters</title>
<style>
  body { margin: 24px; }
  .row { display: flex; gap: 32px; margin-bottom: 40px; align-items: flex-start; }
  .card { width: 90px; height: 64px; border-radius: 12px; background: linear-gradient(135deg, #f59e0b, #e11d48 60%, #6366f1); border: 3px solid #0f172a; }
  .badge { width: 64px; height: 64px; border-radius: 50%; background: #22c55e; }
</style>
<div class="row">
  <div class="card"></div>
  <div class="card" style="filter: blur(2px)"></div>
  <div class="card" style="filter: blur(6px)"></div>
  <div class="card" style="filter: grayscale(1)"></div>
  <div class="card" style="filter: sepia(0.8)"></div>
</div>
<div class="row">
  <div class="card" style="filter: hue-rotate(90deg)"></div>
  <div class="card" style="filter: invert(1)"></div>
  <div class="card" style="filter: saturate(3) contrast(1.5)"></div>
  <div class="card" style="filter: brightness(0.6)"></div>
  <div class="card" style="filter: opacity(0.4)"></div>
</div>
<div class="row">
  <div class="badge" style="filter: drop-shadow(4px 6px 3px rgb(15 23 42 / 0.5))"></div>
  <div class="badge" style="border-radius: 0; background: none; border-bottom: 64px solid #0ea5e9; border-left: 32px solid transparent; border-right: 32px solid transparent; width: 0; height: 0; filter: drop-shadow(0 0 4px #e11d48)"></div>
  <img style="width: 96px; height: 48px; image-rendering: pixelated; filter: drop-shadow(3px 3px 0 #0f172a) drop-shadow(0 0 6px #f59e0b)" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAACCAYAAAB/qH1jAAAAEklEQVR4nGP4z8DwH4SRIKoAAAslD/HAvA0nAAAAAElFTkSuQmCC">
  <div style="width: 90px; height: 64px; border: 4px dashed #6366f1; border-radius: 8px; filter: blur(1.5px)"><div style="margin: 16px; height: 32px; background: #e11d48"></div></div>
</div>
