<!DOCTYPE html>
<title>SVG masks</title>
<style>
  body { margin: 24px; }
  .row { display: flex; gap: 24px; margin-bottom: 24px; align-items: flex-start; }
  svg { background: #f1f5f9; }
</style>
<div class="row">
  <svg width="140" height="100">
    <defs>
      <linearGradient id="fade"><stop offset="0" stop-color="white" /><stop offset="1" stop-color="black" /></linearGradient>
      <mask id="fade-out"><rect width="140" height="100" fill="url(#fade)" /></mask>
    </defs>
    <g mask="url(#fade-out)">
      <rect width="140" height="50" fill="#f59e0b" /><rect y="50" width="140" height="50" fill="#6366f1" />
    </g>
  </svg>
  <svg width="140" height="100">
    <mask id="word" maskUnits="userSpaceOnUse"><rect width="140" height="100" fill="#444" /><text x="70" y="70" text-anchor="middle" font-size="64" font-weight="bold" fill="white">Ab</text></mask>
    <rect width="140" height="100" fill="#e11d48" mask="url(#word)" />
  </svg>
  <svg width="140" height="100">
    <mask id="dots" style="mask-type: alpha" maskContentUnits="objectBoundingBox">
      <circle cx="0.25" cy="0.5" r="0.2" fill="red" /><circle cx="0.75" cy="0.5" r="0.2" fill="blue" fill-opacity="0.4" />
    </mask>
    <rect x="10" y="10" width="120" height="80" fill="#22c55e" mask="url(#dots)" />
  </svg>
</div>
<div class="row">
  <svg width="140" height="100">
    <radialGradient id="spot"><stop offset="0.4" stop-color="white" /><stop offset="1" stop-color="white" stop-opacity="0" /></radialGradient>
    <mask id="vignette" x="0" y="0" width="1" height="1"><circle cx="70" cy="50" r="60" fill="url(#spot)" /></mask>
    <g mask="url(#vignette)" opacity="0.8">
      <rect width="140" height="100" fill="#0ea5e9" />
      <path d="M0 100 L140 0" stroke="#0f172a" stroke-width="8" />
    </g>
  </svg>
  <svg width="140" height="100">
    <clipPath id="half"><rect width="70" height="100" /></clipPath>
    <mask id="stripes" maskUnits="userSpaceOnUse"><rect width="140" height="100" fill="white" /><rect y="30" width="140" height="15" /><rect y="60" width="140" height="15" /></mask>
    <circle cx="70" cy="50" r="45" fill="#a855f7" clip-path="url(#half)" mask="url(#stripes)" />
  </svg>
</div>
