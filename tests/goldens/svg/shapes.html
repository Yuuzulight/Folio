<!DOCTYPE html>
<title>SVG shapes, paths and transforms</title>
<style>
  body { margin: 24px; color: #0f172a; }
  .row { display: flex; gap: 24px; margin-bottom: 24px; align-items: flex-start; }
  svg { background: #f1f5f9; }
</style>
<div class="row">
  <svg width="140" height="100">
    <rect x="10" y="10" width="120" height="80" rx="16" fill="#6366f1" stroke="#0f172a" stroke-width="3" />
    <circle cx="45" cy="50" r="22" fill="#f59e0b" fill-opacity="0.8" />
    <ellipse cx="95" cy="50" rx="30" ry="16" fill="none" stroke="#22c55e" stroke-width="5" />
  </svg>
  <svg width="140" height="100" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet">
    <path d="M12 2 L15.1 8.3 L22 9.3 L17 14.1 L18.2 21 L12 17.8 L5.8 21 L7 14.1 L2 9.3 L8.9 8.3 Z" fill="#e11d48" stroke="#881337" stroke-width="0.8" />
  </svg>
  <svg width="140" height="100">
    <polyline points="10,90 35,40 60,70 85,20 110,55 130,30" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" />
    <polygon points="10,10 40,10 25,35" fill="#a855f7" />
    <line x1="10" y1="95" x2="130" y2="95" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" />
  </svg>
</div>
<div class="row">
  <svg width="140" height="100">
    <path d="M20 80 A 50 50 0 0 1 120 80" fill="none" stroke="#f97316" stroke-width="8" />
    <path d="M40 80 Q 70 10 100 80 T 130 60" fill="none" stroke="#14b8a6" stroke-width="3" />
    <path d="M10 20 C 30 0, 50 40, 70 20 S 110 0, 130 20" fill="none" stroke="#ef4444" stroke-width="2" />
  </svg>
  <svg width="140" height="100">
    <g transform="translate(70 50)">
      <rect x="-30" y="-15" width="60" height="30" fill="#6366f1" opacity="0.3" />
      <rect x="-30" y="-15" width="60" height="30" fill="#6366f1" opacity="0.5" transform="rotate(30)" />
      <rect x="-30" y="-15" width="60" height="30" fill="none" stroke="#0f172a" transform="rotate(60) scale(0.8)" />
      <rect x="-30" y="-15" width="60" height="30" fill="#e11d48" transform="skewX(20) scale(0.4)" />
    </g>
  </svg>
  <svg width="140" height="100" style="color: #16a34a">
    <g fill="currentColor" stroke="#0f172a" stroke-width="2" paint-order="stroke">
      <path d="M20 20 h40 v60 h-40 z M30 30 v40 h20 v-40 z" fill-rule="evenodd" />
      <path d="M80 20 h40 v60 h-40 z M90 30 v40 h20 v-40 z" />
    </g>
    <svg x="95" y="5" width="40" height="20" viewBox="0 0 10 10" preserveAspectRatio="xMinYMin slice">
      <circle cx="5" cy="5" r="5" fill="#f59e0b" />
    </svg>
  </svg>
</div>
