<!DOCTYPE html>
<title>SVG text: anchors, baselines, positions and tspans</title>
<style>
  body { margin: 24px; font-family: sans-serif; }
  svg { background: #f8fafc; }
</style>
<svg width="360" height="220" viewBox="0 0 360 220" font-size="12" fill="#334155">
  <line x1="50" y1="20" x2="50" y2="180" stroke="#94a3b8" />
  <line x1="50" y1="180" x2="340" y2="180" stroke="#94a3b8" />
  <g text-anchor="end" dominant-baseline="middle">
    <text x="44" y="180">0</text>
    <text x="44" y="100">50</text>
    <text x="44" y="20">100</text>
  </g>
  <g fill="#6366f1">
    <rect x="70" y="60" width="40" height="120" />
    <rect x="140" y="100" width="40" height="80" />
    <rect x="210" y="40" width="40" height="140" />
    <rect x="280" y="130" width="40" height="50" />
  </g>
  <g text-anchor="middle">
    <text x="90 160 230 300" y="196" dominant-baseline="hanging">QRST</text>
    <text x="90" y="54" font-size="10" fill="#0f172a">75</text>
    <text x="230" y="34" font-size="10" fill="#0f172a">88</text>
  </g>
  <text x="195" y="12" text-anchor="middle" font-weight="bold" font-size="14" fill="#0f172a">Quarterly <tspan fill="#e11d48">results</tspan></text>
  <text x="340" y="214" text-anchor="end" font-size="9" opacity="0.6" dy="-2">source: <tspan dx="4" font-style="italic">demo</tspan></text>
  <text x="20" y="100" text-anchor="middle" transform="rotate(-90 20 100)" dominant-baseline="central">Value</text>
</svg>
