<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; }
  canvas { display: block; border: 2px solid #333333; }
</style>
</head>
<body>
<canvas id="c" width="400" height="300"></canvas>
<script>
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl');
  gl.viewport(0, 0, 400, 300);
  gl.clearColor(0.1, 0.1, 0.18, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  const vsSource = `
    attribute vec2 a_pos;
    void main() {
      gl_Position = vec4(a_pos, 0.0, 1.0);
    }
  `;
  const fsSource = `
    precision mediump float;
    uniform vec4 u_color;
    void main() {
      gl_FragColor = u_color;
    }
  `;

  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, vsSource);
  gl.compileShader(vs);

  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, fsSource);
  gl.compileShader(fs);

  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const posLoc = gl.getAttribLocation(prog, 'a_pos');
  const colorLoc = gl.getUniformLocation(prog, 'u_color');

  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  const vertices = new Float32Array([
     0.0,  0.6,
    -0.6, -0.6,
     0.6, -0.6
  ]);
  gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

  gl.uniform4f(colorLoc, 0.2, 0.7, 0.9, 1.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
</script>
</body>
</html>
