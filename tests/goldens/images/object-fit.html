<!DOCTYPE html>
<title>object-fit and object-position</title>
<style>
  body { margin: 8px; }
  img { width: 96px; height: 96px; margin: 0 8px 8px 0; border: 2px solid #334155; background: #e2e8f0; }
  .pixelated { image-rendering: pixelated; }
</style>
<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAACCAYAAAB/qH1jAAAAEklEQVR4nGP4z8DwH4SRIKoAAAslD/HAvA0nAAAAAElFTkSuQmCC" style="object-fit: fill">

<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAACCAYAAAB/qH1jAAAAEklEQVR4nGP4z8DwH4SRIKoAAAslD/HAvA0nAAAAAElFTkSuQmCC" style="object-fit: cover">
<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAACCAYAAAB/qH1jAAAAEklEQVR4nGP4z8DwH4SRIKoAAAslD/HAvA0nAAAAAElFTkSuQmCC" style="object-fit: none">
