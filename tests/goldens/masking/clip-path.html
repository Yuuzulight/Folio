<!DOCTYPE html>
<title>clip-path</title>
<style>
  body { margin: 24px; }
  .row { display: flex; gap: 28px; margin-bottom: 36px; align-items: flex-start; }
  .tile { width: 110px; height: 90px; background: linear-gradient(135deg, #f59e0b, #e11d48 55%, #6366f1); border: 4px solid #0f172a; box-shadow: 0 0 0 6px #22c55e; }
</style>
<div class="row">
  <div class="tile" style="clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%)"></div>
  <div class="tile" style="clip-path: polygon(evenodd, 50% 0, 79% 90%, 2% 35%, 98% 35%, 21% 90%)"></div>
  <div class="tile" style="clip-path: polygon(0 0, 100% 0, 100% 75%, 75% 75%, 75% 100%, 50% 75%, 0 75%)"></div>
  <div class="tile" style="clip-path: polygon(20% 0, 80% 0, 100% 50%, 80% 100%, 20% 100%, 0 50%) padding-box"></div>
</div>
<div class="row">
  <div class="tile" style="clip-path: path('M 59 20 C 59 6, 34 0, 30 22 C 26 0, 1 6, 1 20 C 1 45, 30 60, 30 80 C 30 60, 59 45, 59 20 Z')"></div>
  <div class="tile" style="clip-path: path(evenodd, 'M 10 45 A 45 45 0 1 1 100 45 A 45 45 0 1 1 10 45 Z M 35 45 A 20 20 0 1 0 75 45 A 20 20 0 1 0 35 45 Z')"></div>
  <div class="tile" style="clip-path: path('M0 90 Q 30 0 55 45 T 110 0 V 90 Z')"></div>
  <div class="tile" style="clip-path: circle(40% at 30% 40%); transform: rotate(10deg)"></div>
</div>
<div class="row">
  <div class="tile" style="clip-path: inset(12px 8px round 20px 4px)"></div>
  <div class="tile" style="clip-path: ellipse(closest-side farthest-side at 40% 30%)"></div>
  <div class="tile" style="clip-path: xywh(10px 10px 60% 50% round 8px); opacity: 0.7"></div>
  <div class="tile" style="clip-path: margin-box; margin: 10px; border-radius: 24px"></div>
</div>
