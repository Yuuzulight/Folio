<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}

.card{margin:4px;background:#fff;border:1px solid #E3E3F3;border-radius:12px;padding:4px}

.card svg text{font-family:"Source Sans 3",sans-serif}
.folio-diagram-node{fill:#ECECFF;stroke:#5B5BF0;stroke-width:2}

.folio-diagram-edge{stroke:#5B5BF0;stroke-width:2}
.folio-diagram-label{fill:#1E1B3A;stroke:none;font-weight:600}
.folio-diagram-edge-label-bg{fill:#fff}
.folio-diagram-participant{fill:#1E1B3A;stroke:none;font-weight:600}
#arrow path{fill:#5B5BF0}
