<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;background:#F4F4FB;color:#1E1B3A;font:15px "Source Sans 3",sans-serif}
.card{margin:4px;background:#fff;border:1px solid #E3E3F3;border-radius:12px;padding:4px}
.card svg{display:block;max-width:100%;height:auto}
.card svg text{font-family:"Source Sans 3",sans-serif}
.folio-diagram-node{fill:#ECECFF;stroke:#5B5BF0;stroke-width:2}
.folio-diagram-subgraph{stroke:#9A9AD8;stroke-dasharray:4 3}
.folio-diagram-edge{stroke:#5B5BF0;stroke-width:2}
.folio-diagram-label{fill:#1E1B3A;stroke:none;font-weight:600}
.folio-diagram-edge-label-bg{fill:#fff}
.folio-diagram-participant{fill:#1E1B3A;stroke:none;font-weight:600}
#arrow path{fill:#5B5BF0}
</style></head><body><div class="card"><script type="text/plain" id="source">
sequenceDiagram
  participant A as Alice
  participant B as Bob
  A->>B: Hello
  B-->>A: Hi there
</script><!--svg--><svg class="folio-diagram" xmlns="http://www.w3.org/2000/svg" width="236" height="170" viewBox="64 2 236 170"><defs><marker id="arrow" markerWidth="4" markerHeight="3" refX="4" refY="1.5" orient="auto"><path d="M0,0 L4,1.5 L0,3 z"/></marker></defs><g class="folio-diagram-content" fill="white" stroke="currentColor" stroke-width="2" font-family="sans-serif" font-size="14"><text class="folio-diagram-participant" data-role="participant" x="80" y="30">Alice</text><path class="folio-diagram-lifeline" d="M 80 40 L 80 156"/><text class="folio-diagram-participant" data-role="participant" x="260" y="30">Bob</text><path class="folio-diagram-lifeline" d="M 260 40 L 260 156"/><path class="folio-diagram-edge sequence-message" data-kind="-&gt;&gt;"  d="M 80 60 L 260 60" marker-end="url(#arrow)"/><text class="folio-diagram-label sequence-message-label" x="90" y="54">Hello</text><path class="folio-diagram-edge sequence-message" data-kind="--&gt;&gt;" stroke-dasharray="4 3" d="M 260 108 L 80 108" marker-end="url(#arrow)"/><text class="folio-diagram-label sequence-message-label" x="90" y="102">Hi there</text></g></svg><!--/svg--></div></body></html>
