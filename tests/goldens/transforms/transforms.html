<!DOCTYPE html>
<title>2D transforms</title>
<style>
  body { margin: 24px; font-size: 18px; color: #0f172a; }
  .row { display: flex; gap: 40px; margin-bottom: 48px; align-items: flex-start; }
  .box { width: 80px; height: 60px; background: #f8fafc; border: 3px solid #6366f1; border-radius: 10px; }
  img { width: 80px; height: 40px; }
</style>
<div class="row">
  <div class="box" style="transform: rotate(15deg)"></div>
  <div class="box" style="transform: skewX(-20deg); border-style: dashed"></div>
  <div class="box" style="transform: scale(1.3, 0.7); box-shadow: 4px 6px 8px rgb(15 23 42 / 0.4)"></div>
  <div class="box" style="rotate: -30deg; translate: 10px; background: linear-gradient(90deg, #f59e0b, #0ea5e9)"></div>
  <img style="transform: rotate(45deg)" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAACCAYAAAB/qH1jAAAAEklEQVR4nGP4z8DwH4SRIKoAAAslD/HAvA0nAAAAAElFTkSuQmCC">
</div>
<div class="row">
  <p style="margin: 0; transform: rotate(-8deg); text-decoration: underline wavy #e11d48; text-shadow: 1px 1px 0 #f59e0b">Rotated typography</p>
  <p style="margin: 0; transform: matrix(1, 0.2, 0, 1, 0, 0); text-decoration: underline; outline: 1px solid #94a3b8">Sheared, gyp</p>
  <div style="width: 60px; height: 60px; overflow: hidden; border: 1px solid #334155; transform: rotate(20deg)">
    <div style="width: 90px; height: 30px; background: #22c55e; transform: translate(-10px, 10px) rotate(-20deg)"></div>
  </div>
  <div style="opacity: 0.5; transform: scale(0.8) rotate(10deg); width: 60px; height: 40px; background: #e11d48"></div>
</div>
